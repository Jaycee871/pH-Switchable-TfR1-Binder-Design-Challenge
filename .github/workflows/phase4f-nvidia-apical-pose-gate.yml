name: Phase 4F Full Human-Mouse Pose Gate

on:
  push:
    paths:
      - "designs/family_A_conserved/nvidia_apical_pose_first/pose_screen_candidates.csv"
      - "scripts/nvidia_boltz2_validate_nvidia_apical_pose.py"
      - ".github/workflows/phase4f-nvidia-apical-pose-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Biopython
        run: python -m pip install "biopython>=1.85"

      - name: Check pose-screen candidates
        id: candidates
        shell: bash
        run: |
          if [[ -s designs/family_A_conserved/nvidia_apical_pose_first/pose_screen_candidates.csv ]] && \
             [[ $(wc -l < designs/family_A_conserved/nvidia_apical_pose_first/pose_screen_candidates.csv) -gt 1 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No NVIDIA pose-screen candidates yet."
          fi

      - name: Run full human-mouse pose gate
        if: steps.candidates.outputs.present == 'true'
        run: python scripts/nvidia_boltz2_validate_nvidia_apical_pose.py

      - name: Inspect gate result
        if: steps.candidates.outputs.present == 'true'
        run: cat predictions/nvidia_apical_pose_screen/batch_summary.json

      - name: Commit pose-screen outputs
        if: steps.candidates.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/nvidia_apical_pose_screen
          if git diff --cached --quiet; then
            echo "No Phase 4F output changes."
            exit 0
          fi
          git commit -m "Add full human-mouse pose gate for NVIDIA apical designs"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload pose-screen artifact
        if: always() && steps.candidates.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfr1-nvidia-apical-full-pose-screen
          path: predictions/nvidia_apical_pose_screen/
          if-no-files-found: warn
          retention-days: 14

# Triggered after Phase 3G pose-screen candidate became available.
