name: Phase 2D NVIDIA Apical-Only RFdiffusion

on:
  push:
    paths:
      - "scripts/nvidia_rfdiffusion_apical_only.py"
      - ".github/workflows/phase2d-nvidia-apical-only-rfdiffusion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and gate apical-only backbones
        run: python scripts/nvidia_rfdiffusion_apical_only.py

      - name: Inspect selection
        shell: bash
        run: |
          set -euxo pipefail
          test -s structures/rfdiffusion/nvidia_apical_only/selection_summary.json
          cat structures/rfdiffusion/nvidia_apical_only/selection_summary.json

      - name: Commit RFdiffusion campaign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add structures/rfdiffusion/nvidia_apical_only
          if git diff --cached --quiet; then
            echo "No Phase 2D output changes."
            exit 0
          fi
          git commit -m "Add NVIDIA apical-only RFdiffusion backbones"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload campaign artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfr1-nvidia-apical-only-rfdiffusion
          path: structures/rfdiffusion/nvidia_apical_only/
          if-no-files-found: warn
          retention-days: 14
