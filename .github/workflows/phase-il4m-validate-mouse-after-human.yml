name: Phase IL4-M Validate Mouse After Human Anchor

on:
  workflow_run:
    workflows:
      - "Phase IL4-H Validate Human Anchor Encoding"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check human-pass sequences
        id: gate
        shell: bash
        run: |
          if [[ ! -s predictions/inference_loop_human_anchor_il4_human/human_pose_pass_ids.json ]]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          N="$(python -c 'import json; p="predictions/inference_loop_human_anchor_il4_human/human_pose_pass_ids.json"; print(len(json.load(open(p)).get("human_pose_pass_ids",[])))')"
          if [[ "$N" -gt 0 ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "No IL4-H human parent; mouse validation skipped."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.passed == 'true'
        with:
          python-version: "3.11"

      - name: Install Biopython
        if: steps.gate.outputs.passed == 'true'
        run: python -m pip install "biopython>=1.85"

      - name: Sequence-only full-mouse and homologous-epitope validation
        if: steps.gate.outputs.passed == 'true'
        run: python scripts/nvidia_boltz2_validate_il4_mouse_after_human.py

      - name: Inspect
        if: steps.gate.outputs.passed == 'true'
        run: |
          cat predictions/inference_loop_human_anchor_il4_cross_species/batch_summary.json
          cat predictions/inference_loop_human_anchor_il4_cross_species/cross_species_pose_pass_ids.json

      - name: Commit IL4-M
        if: steps.gate.outputs.passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/inference_loop_human_anchor_il4_cross_species
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add IL4-M cross-species validation for human-anchor sequences"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            sleep 2
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.passed == 'true'
        with:
          name: tfr1-il4-mouse-after-human
          path: predictions/inference_loop_human_anchor_il4_cross_species/
          if-no-files-found: warn
          retention-days: 14
