name: Phase 4G Validate Cross-Species Rescue

on:
  push:
    paths:
      - "scripts/nvidia_boltz2_validate_rescue_pose.py"
      - ".github/workflows/phase4g-validate-cross-species-rescue.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "biopython>=1.85"
      - name: Validate rescue candidates
        run: python scripts/nvidia_boltz2_validate_rescue_pose.py
      - name: Inspect
        run: |
          cat predictions/nvidia_apical_rescue_pose_screen/batch_summary.json
          cat predictions/nvidia_apical_rescue_pose_screen/pose_pass_ids.json
      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/nvidia_apical_rescue_pose_screen
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add cross-species rescue full-pose validation"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-cross-species-rescue-pose-screen
          path: predictions/nvidia_apical_rescue_pose_screen/
          if-no-files-found: warn
          retention-days: 14
