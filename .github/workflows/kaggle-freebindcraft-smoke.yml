name: Kaggle TfR1 FreeBindCraft Smoke

on:
  push:
    paths:
      - "kaggle/freebindcraft_smoke_v1/**"
      - ".github/workflows/kaggle-freebindcraft-smoke.yml"
  workflow_dispatch:

concurrency:
  group: tfr1-kaggle-freebindcraft-smoke
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Push and monitor FreeBindCraft smoke
        id: kaggle
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p freebindcraft_outputs
          test -n "${KAGGLE_API_TOKEN:-}"
          KERNEL="packkwanlow/tfr1-freebindcraft-smoke-v1"
          DIR="kaggle/freebindcraft_smoke_v1"
          kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 --timeout 12600
          doneflag=0
          for i in $(seq 1 210); do
            status="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[poll $i] $status"
            if echo "$status" | grep -Eqi 'complete|completed'; then doneflag=1; break; fi
            if echo "$status" | grep -Eqi 'error|failed|cancelled'; then
              kaggle kernels logs "$KERNEL" > freebindcraft_outputs/kaggle-run.log || true
              exit 1
            fi
            sleep 60
          done
          if [[ "$doneflag" != 1 ]]; then
            kaggle kernels logs "$KERNEL" > freebindcraft_outputs/kaggle-run.log || true
            exit 1
          fi
          kaggle kernels output "$KERNEL" -p freebindcraft_outputs -o
          kaggle kernels logs "$KERNEL" > freebindcraft_outputs/kaggle-run.log || true
          find freebindcraft_outputs -type f -printf '%p %s bytes\n' | sort
      - name: Record workflow status
        if: always()
        run: |
          mkdir -p freebindcraft_outputs
          {
            echo "kaggle_outcome=${{ steps.kaggle.outcome }}"
            echo "sha=$GITHUB_SHA"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } > freebindcraft_outputs/workflow-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-freebindcraft-smoke-v1
          path: freebindcraft_outputs/
          if-no-files-found: warn
          retention-days: 14
      - name: Sync compact outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          DEST="freebindcraft/kaggle_smoke_results"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          if [[ -d freebindcraft_outputs/tfr1_freebindcraft_smoke_v1 ]]; then
            cp -R freebindcraft_outputs/tfr1_freebindcraft_smoke_v1/. "$DEST/"
          fi
          for f in freebindcraft_outputs/kaggle-run.log freebindcraft_outputs/workflow-status.txt; do
            [[ ! -f "$f" ]] || cp "$f" "$DEST/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Record TfR1 FreeBindCraft Kaggle smoke"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail if Kaggle smoke failed
        if: steps.kaggle.outcome != 'success'
        run: exit 1
