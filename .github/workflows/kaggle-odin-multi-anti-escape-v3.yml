name: Kaggle TfR1 Odin-Multi Anti-Escape V3

on:
  push:
    paths:
      - "kaggle/odin_multi_anti_escape_v3/TRIGGER"
  workflow_dispatch:

concurrency:
  group: tfr1-kaggle-odin-multi-anti-escape-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight anti-escape runner
        shell: bash
        run: |
          set -euo pipefail
          FILE="kaggle/odin_multi_anti_escape_v3/tfr1_odin_multi_anti_escape_v3.py"
          python -m py_compile "$FILE"
          test "$(grep -o -- '"--context"' "$FILE" | wc -l)" -eq 4
          grep -Fq '"--num-designs","1"' "$FILE"
          grep -Fq '"best_clipped_i_pae_ratio"' "$FILE"
          grep -Fq 'EMBEDDED_ESCAPE_B64' "$FILE"
          echo "Anti-escape v3 static preflight passed."

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Push and monitor anti-escape v3
        id: kaggle
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p anti_escape_outputs
          KERNEL="packkwanlow/tfr1-odin-multi-anti-escape-v3"
          DIR="kaggle/odin_multi_anti_escape_v3"

          kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 --timeout 19800

          doneflag=0
          for i in $(seq 1 330); do
            status="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[poll $i] $status"
            if echo "$status" | grep -Eqi 'complete|completed'; then
              doneflag=1
              break
            fi
            if echo "$status" | grep -Eqi 'error|failed|cancelled'; then
              kaggle kernels logs "$KERNEL" > anti_escape_outputs/kaggle-run.log || true
              break
            fi
            sleep 60
          done

          kaggle kernels output "$KERNEL" -p anti_escape_outputs -o || true
          kaggle kernels logs "$KERNEL" > anti_escape_outputs/kaggle-run.log || true
          find anti_escape_outputs -type f -printf '%p %s bytes\n' | sort

          if [[ "$doneflag" != 1 ]]; then
            echo "Kaggle kernel did not report completed state inside monitor window." >&2
            exit 1
          fi

      - name: Record status
        if: always()
        run: |
          mkdir -p anti_escape_outputs
          {
            echo "kaggle_outcome=${{ steps.kaggle.outcome }}"
            echo "sha=$GITHUB_SHA"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } > anti_escape_outputs/workflow-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-odin-multi-anti-escape-v3
          path: anti_escape_outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Sync compact anti-escape outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          DEST="odin_multi/kaggle_anti_escape_v3"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          if [[ -d anti_escape_outputs/tfr1_odin_multi_anti_escape_v3 ]]; then
            SRC="anti_escape_outputs/tfr1_odin_multi_anti_escape_v3"
            cp "$SRC/smoke_summary.json" "$DEST/" 2>/dev/null || true
            cp "$SRC/selection.csv" "$DEST/" 2>/dev/null || true
            cp "$SRC/selected_sequences.fasta" "$DEST/" 2>/dev/null || true
            cp "$SRC/design_exit_code.txt" "$DEST/" 2>/dev/null || true
            cp "$SRC/select_exit_code.txt" "$DEST/" 2>/dev/null || true
            cp "$SRC/driver_probe.txt" "$DEST/" 2>/dev/null || true
            cp "$SRC/odin_warm_start_patch.txt" "$DEST/" 2>/dev/null || true
          fi
          cp anti_escape_outputs/kaggle-run.log "$DEST/" 2>/dev/null || true
          cp anti_escape_outputs/workflow-status.txt "$DEST/" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record TfR1 Odin-Multi anti-escape v3"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            sleep 2
          done
          exit 1

      - name: Fail if Kaggle campaign failed
        if: steps.kaggle.outcome != 'success'
        run: exit 1
