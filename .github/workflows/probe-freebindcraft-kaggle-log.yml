name: Probe Running Kaggle FreeBindCraft Log
# probe-refresh-2026-10-29-0036

on:
  push:
    paths:
      - ".github/workflows/probe-freebindcraft-kaggle-log.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --quiet --upgrade kaggle
      - name: Fetch current kernel status and logs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/freebindcraft_live_probe
          KERNEL="packkwanlow/tfr1-freebindcraft-smoke-v1"
          kaggle kernels status "$KERNEL" > analysis/freebindcraft_live_probe/status.txt 2>&1 || true
          kaggle kernels logs "$KERNEL" > analysis/freebindcraft_live_probe/live.log 2>&1 || true
          rm -rf /tmp/fbc_running_output
          mkdir -p /tmp/fbc_running_output
          kaggle kernels output "$KERNEL" -p /tmp/fbc_running_output -o > analysis/freebindcraft_live_probe/output_probe.txt 2>&1 || true
          find /tmp/fbc_running_output -type f -printf '%P %s bytes\n' | sort > analysis/freebindcraft_live_probe/output_files.txt || true
          tail -n 200 analysis/freebindcraft_live_probe/live.log || true
          echo "--- output probe ---"
          cat analysis/freebindcraft_live_probe/output_probe.txt || true
          cat analysis/freebindcraft_live_probe/output_files.txt || true
      - name: Commit probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/freebindcraft_live_probe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe running FreeBindCraft Kaggle log"
          git pull --rebase origin main
          git push origin HEAD:main
