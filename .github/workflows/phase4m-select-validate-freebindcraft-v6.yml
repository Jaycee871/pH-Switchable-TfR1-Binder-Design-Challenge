name: Phase 4M Select and Validate FreeBindCraft V6 Tempered Binary

on:
  workflow_run:
    workflows:
      - "Kaggle TfR1 FreeBindCraft V6 Tempered Binary"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: tfr1-phase4m-freebindcraft-v6-tempered
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  select-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select only a true-hotspot v6 trajectory
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_freebindcraft_v6_tempered_candidate.py

          CSV="designs/family_D_freebindcraft/v6_tempered_binary_pose_screen/pose_screen_candidates.csv"
          test -s "$CSV"

          if [[ $(wc -l < "$CSV") -gt 1 ]]; then
            echo "candidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "candidate=false" >> "$GITHUB_OUTPUT"
            echo "No v6 trajectory passed the independent 5A hotspot gate."
          fi

      - name: Install Biopython
        if: steps.select.outputs.candidate == 'true'
        run: python -m pip install "biopython>=1.85"

      - name: Full human-mouse pose validation
        if: steps.select.outputs.candidate == 'true'
        run: python scripts/nvidia_boltz2_validate_freebindcraft_v6_tempered_pose.py

      - name: Inspect result
        if: always()
        shell: bash
        run: |
          cat designs/family_D_freebindcraft/v6_tempered_binary_pose_screen/selection_decision.json || true
          cat predictions/freebindcraft_v6_tempered_binary_pose_screen/batch_summary.json || true
          cat predictions/freebindcraft_v6_tempered_binary_pose_screen/pose_pass_ids.json || true

      - name: Commit Phase 4M outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add designs/family_D_freebindcraft/v6_tempered_binary_pose_screen
          if [[ -d predictions/freebindcraft_v6_tempered_binary_pose_screen ]]; then
            git add predictions/freebindcraft_v6_tempered_binary_pose_screen
          fi

          if git diff --cached --quiet; then
            echo "No Phase 4M output changes."
            exit 0
          fi

          git commit -m "Add Phase 4M FreeBindCraft v6 tempered-binary validation"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-phase4m-freebindcraft-v6-tempered
          path: |
            designs/family_D_freebindcraft/v6_tempered_binary_pose_screen/
            predictions/freebindcraft_v6_tempered_binary_pose_screen/
          if-no-files-found: warn
          retention-days: 14
