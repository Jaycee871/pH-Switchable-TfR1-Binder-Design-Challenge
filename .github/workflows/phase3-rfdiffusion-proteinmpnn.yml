name: Phase 3 Seeded RFdiffusion to ProteinMPNN

on:
  push:
    paths:
      - ".github/workflows/phase3-rfdiffusion-proteinmpnn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backbone-to-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare TfR1 target
        run: python scripts/prepare_targets.py

      - name: Select seeded conserved-apical backbone
        run: python scripts/nvidia_rfdiffusion_select.py

      - name: Show selected backbone gate
        shell: bash
        run: |
          set -euxo pipefail
          test -s designs/family_A_conserved/seeded_selection/selected_backbone.pdb
          cat designs/family_A_conserved/seeded_selection/selection_summary.json

      - name: Design binder sequences with ProteinMPNN
        run: python scripts/nvidia_proteinmpnn_smoke.py

      - name: Validate sequence outputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s designs/family_A_conserved/proteinmpnn_seeded/designed_sequences.fasta
          test -s designs/family_A_conserved/proteinmpnn_seeded/candidates.csv
          cat designs/family_A_conserved/proteinmpnn_seeded/result_summary.json
          head -n 12 designs/family_A_conserved/proteinmpnn_seeded/candidates.csv

      - name: Upload Phase 3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfr1-phase3-seeded-backbone-and-sequences
          path: |
            designs/family_A_conserved/seeded_selection/
            designs/family_A_conserved/proteinmpnn_seeded/
          if-no-files-found: warn
          retention-days: 14
