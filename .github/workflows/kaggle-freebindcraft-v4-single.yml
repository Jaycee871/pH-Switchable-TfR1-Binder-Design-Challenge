name: Kaggle TfR1 FreeBindCraft V4 Single Attempt

on:
  push:
    paths:
      - "kaggle/freebindcraft_smoke_v4_single/TRIGGER"
  workflow_dispatch:

concurrency:
  group: tfr1-kaggle-freebindcraft-v4-single
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Push and monitor bounded FreeBindCraft v4
        id: kaggle
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p freebindcraft_v4_outputs
          test -n "${KAGGLE_API_TOKEN:-}"
          KERNEL="packkwanlow/tfr1-freebindcraft-smoke-v4-single"
          DIR="kaggle/freebindcraft_smoke_v4_single"

          kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 --timeout 9000

          doneflag=0
          for i in $(seq 1 150); do
            status="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[poll $i] $status"
            if echo "$status" | grep -Eqi 'complete|completed'; then
              doneflag=1
              break
            fi
            if echo "$status" | grep -Eqi 'error|failed|cancelled'; then
              kaggle kernels logs "$KERNEL" > freebindcraft_v4_outputs/kaggle-run.log || true
              exit 1
            fi
            sleep 60
          done

          if [[ "$doneflag" != 1 ]]; then
            kaggle kernels logs "$KERNEL" > freebindcraft_v4_outputs/kaggle-run.log || true
            exit 1
          fi

          kaggle kernels output "$KERNEL" -p freebindcraft_v4_outputs -o
          kaggle kernels logs "$KERNEL" > freebindcraft_v4_outputs/kaggle-run.log || true
          find freebindcraft_v4_outputs -type f -printf '%p %s bytes\n' | sort

      - name: Record workflow status
        if: always()
        run: |
          mkdir -p freebindcraft_v4_outputs
          {
            echo "kaggle_outcome=${{ steps.kaggle.outcome }}"
            echo "sha=$GITHUB_SHA"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } > freebindcraft_v4_outputs/workflow-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-freebindcraft-v4-single
          path: freebindcraft_v4_outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Sync compact outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          DEST="freebindcraft/kaggle_v4_single_results"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          if [[ -d freebindcraft_v4_outputs/tfr1_freebindcraft_smoke_v4_single ]]; then
            cp -R freebindcraft_v4_outputs/tfr1_freebindcraft_smoke_v4_single/. "$DEST/"
          fi
          for f in freebindcraft_v4_outputs/kaggle-run.log freebindcraft_v4_outputs/workflow-status.txt; do
            [[ ! -f "$f" ]] || cp "$f" "$DEST/"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Record TfR1 FreeBindCraft v4 single-attempt smoke"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if Kaggle smoke failed
        if: steps.kaggle.outcome != 'success'
        run: exit 1
