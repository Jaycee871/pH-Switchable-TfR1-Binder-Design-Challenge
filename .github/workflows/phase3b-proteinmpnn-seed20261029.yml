name: Phase 3B ProteinMPNN on Seed 20261029

on:
  push:
    paths:
      - ".github/workflows/phase3b-proteinmpnn-seed20261029.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proteinmpnn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recover seeded RFdiffusion artifact
        uses: actions/download-artifact@v4
        with:
          name: tfr1-phase3-seeded-backbone-and-sequences
          path: recovered
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 40681815723

      - name: Verify selected conditional backbone
        shell: bash
        run: |
          set -euxo pipefail
          test -s recovered/seeded_selection/rfdiffusion_seed_20261029.pdb
          cat recovered/seeded_selection/selection_summary.json

      - name: Design binder sequences with ProteinMPNN
        env:
          BACKBONE_PDB: ${{ github.workspace }}/recovered/seeded_selection/rfdiffusion_seed_20261029.pdb
        run: python scripts/nvidia_proteinmpnn_smoke.py

      - name: Validate sequence outputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s designs/family_A_conserved/proteinmpnn_seeded/designed_sequences.fasta
          test -s designs/family_A_conserved/proteinmpnn_seeded/candidates.csv
          cat designs/family_A_conserved/proteinmpnn_seeded/result_summary.json
          head -n 20 designs/family_A_conserved/proteinmpnn_seeded/candidates.csv

      - name: Upload ProteinMPNN candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfr1-seed20261029-proteinmpnn
          path: |
            recovered/seeded_selection/rfdiffusion_seed_20261029.pdb
            recovered/seeded_selection/selection_summary.json
            designs/family_A_conserved/proteinmpnn_seeded/
          if-no-files-found: warn
          retention-days: 14
