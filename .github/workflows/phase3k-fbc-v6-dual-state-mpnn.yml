name: Phase 3K FreeBindCraft V6 Human-Mouse Dual-State MPNN

on:
  push:
    paths:
      - "scripts/nvidia_proteinmpnn_fbc_v6_dual_state.py"
      - ".github/workflows/phase3k-fbc-v6-dual-state-mpnn.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tied-sequence human-mouse dual-state ProteinMPNN
        run: python scripts/nvidia_proteinmpnn_fbc_v6_dual_state.py

      - name: Inspect
        run: |
          cat designs/family_B_multistate/fbc_v6_dual_state_mpnn/result_summary.json
          cat designs/family_B_multistate/fbc_v6_dual_state_mpnn/pose_screen_candidates.csv

      - name: Commit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designs/family_B_multistate/fbc_v6_dual_state_mpnn
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add human-mouse dual-state ProteinMPNN sequences"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-fbc-v6-dual-state-mpnn
          path: designs/family_B_multistate/fbc_v6_dual_state_mpnn/
          if-no-files-found: warn
          retention-days: 14
