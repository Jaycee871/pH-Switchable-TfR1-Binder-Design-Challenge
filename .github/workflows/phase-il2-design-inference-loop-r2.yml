name: Phase IL2 Design Sparse Inference Loop R2

on:
  push:
    paths:
      - "inference_loop_r2/TRIGGER"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight Python syntax
        run: python -m py_compile scripts/nvidia_proteinmpnn_inference_loop_r2.py

      - name: Install Biopython
        run: python -m pip install "biopython>=1.85"

      - name: Run sparse seven-position full-context reconciliation
        run: python scripts/nvidia_proteinmpnn_inference_loop_r2.py

      - name: Inspect
        run: |
          cat designs/inference_loop/full_context_r2/result_summary.json
          cat designs/inference_loop/full_context_r2/pose_screen_candidates.csv

      - name: Commit R2 designs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add designs/inference_loop/full_context_r2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add sparse full-context inference-loop R2 candidates"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            sleep 2
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-inference-loop-r2-design
          path: designs/inference_loop/full_context_r2/
          if-no-files-found: warn
          retention-days: 14
