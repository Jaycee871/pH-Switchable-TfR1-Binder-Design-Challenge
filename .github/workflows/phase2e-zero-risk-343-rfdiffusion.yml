name: Phase 2E Zero-Risk Compact 343 RFdiffusion

on:
  push:
    paths:
      - "scripts/nvidia_rfdiffusion_zero_risk_343.py"
      - ".github/workflows/phase2e-zero-risk-343-rfdiffusion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate zero-risk 343-cluster backbones
        run: python scripts/nvidia_rfdiffusion_zero_risk_343.py
      - name: Inspect results
        if: always()
        run: |
          if [[ -s structures/rfdiffusion/nvidia_zero_risk_343/selection_summary.json ]]; then
            cat structures/rfdiffusion/nvidia_zero_risk_343/selection_summary.json
          fi
      - name: Commit campaign
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d structures/rfdiffusion/nvidia_zero_risk_343 ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add structures/rfdiffusion/nvidia_zero_risk_343
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add zero-risk compact 343 RFdiffusion campaign"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfr1-zero-risk-343-rfdiffusion
          path: structures/rfdiffusion/nvidia_zero_risk_343/
          if-no-files-found: warn
          retention-days: 14
