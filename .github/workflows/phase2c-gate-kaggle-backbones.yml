name: Phase 2C Gate Kaggle RFdiffusion Backbones

on:
  push:
    paths:
      - "predictions/rfdiffusion_pilot_v1/kaggle/**"
      - "scripts/select_kaggle_backbones.py"
      - ".github/workflows/phase2c-gate-kaggle-backbones.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate synced Kaggle RFdiffusion backbones
        run: python scripts/select_kaggle_backbones.py

      - name: Commit strict-gate outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add structures/rfdiffusion/kaggle_pilot_selected
          if git diff --cached --quiet; then
            echo "No gate output changes."
            exit 0
          fi
          git commit -m "Gate Kaggle TfR1 RFdiffusion backbones"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfr1-kaggle-backbone-gate
          path: structures/rfdiffusion/kaggle_pilot_selected/
          if-no-files-found: warn
          retention-days: 14
