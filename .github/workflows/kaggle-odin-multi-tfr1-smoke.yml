name: Kaggle TfR1 Odin-Multi Crossreactivity Smoke

on:
  push:
    paths:
      - "kaggle/odin_multi_tfr1_smoke/TRIGGER"
  workflow_dispatch:

concurrency:
  group: tfr1-kaggle-odin-multi-crossreactivity
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Push and monitor Odin-Multi smoke
        id: kaggle
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p odin_outputs
          KERNEL="packkwanlow/tfr1-odin-multi-crossreactivity-smoke"
          DIR="kaggle/odin_multi_tfr1_smoke"

          kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 --timeout 12600

          doneflag=0
          for i in $(seq 1 210); do
            status="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[poll $i] $status"
            if echo "$status" | grep -Eqi 'complete|completed'; then
              doneflag=1
              break
            fi
            if echo "$status" | grep -Eqi 'error|failed|cancelled'; then
              kaggle kernels logs "$KERNEL" > odin_outputs/kaggle-run.log || true
              break
            fi
            sleep 60
          done

          kaggle kernels output "$KERNEL" -p odin_outputs -o || true
          kaggle kernels logs "$KERNEL" > odin_outputs/kaggle-run.log || true
          find odin_outputs -type f -printf '%p %s bytes\n' | sort

          if [[ "$doneflag" != 1 ]]; then
            exit 1
          fi

      - name: Record status
        if: always()
        run: |
          mkdir -p odin_outputs
          {
            echo "kaggle_outcome=${{ steps.kaggle.outcome }}"
            echo "sha=$GITHUB_SHA"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } > odin_outputs/workflow-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-odin-multi-crossreactivity
          path: odin_outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Sync compact Odin outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          DEST="odin_multi/kaggle_crossreactivity_smoke"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          if [[ -d odin_outputs/tfr1_odin_multi_crossreactivity_smoke ]]; then
            cp odin_outputs/tfr1_odin_multi_crossreactivity_smoke/smoke_summary.json "$DEST/" 2>/dev/null || true
            cp odin_outputs/tfr1_odin_multi_crossreactivity_smoke/selection.csv "$DEST/" 2>/dev/null || true
            cp odin_outputs/tfr1_odin_multi_crossreactivity_smoke/selected_sequences.fasta "$DEST/" 2>/dev/null || true
            cp odin_outputs/tfr1_odin_multi_crossreactivity_smoke/design_exit_code.txt "$DEST/" 2>/dev/null || true
            cp odin_outputs/tfr1_odin_multi_crossreactivity_smoke/select_exit_code.txt "$DEST/" 2>/dev/null || true
            cp odin_outputs/tfr1_odin_multi_crossreactivity_smoke/driver_probe.txt "$DEST/" 2>/dev/null || true
          fi
          cp odin_outputs/kaggle-run.log "$DEST/" 2>/dev/null || true
          cp odin_outputs/workflow-status.txt "$DEST/" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record TfR1 Odin-Multi crossreactivity smoke"

          # main may advance while the Kaggle job is running. Rebase-and-retry
          # rather than failing the scientific run on a Git race.
          pushed=0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push race on attempt $attempt; retrying after fetch/rebase."
            git fetch origin main
            sleep 2
          done
          test "$pushed" = 1

      - name: Fail if Kaggle smoke failed
        if: steps.kaggle.outcome != 'success'
        run: exit 1
