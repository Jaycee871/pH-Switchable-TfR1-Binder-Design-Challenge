name: Phase 4R Validate Odin-Multi Seeded V2

on:
  workflow_run:
    workflows:
      - "Kaggle TfR1 Odin-Multi Seeded V2"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check seeded-v2 selection
        id: selection
        shell: bash
        run: |
          if [[ -s odin_multi/kaggle_seeded_v2/selection.csv ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No seeded-v2 Odin selection available."
          fi

      - name: Install Biopython
        if: steps.selection.outputs.present == 'true'
        run: python -m pip install "biopython>=1.85"

      - name: Validate selected seeded-v2 designs
        if: steps.selection.outputs.present == 'true'
        run: python scripts/run_phase4r_odin_seeded_v2.py

      - name: Inspect
        if: steps.selection.outputs.present == 'true'
        run: |
          cat predictions/odin_multi_seeded_v2_pose_screen/batch_summary.json
          cat predictions/odin_multi_seeded_v2_pose_screen/pose_pass_ids.json

      - name: Commit results
        if: steps.selection.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/odin_multi_seeded_v2_pose_screen
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Phase 4R seeded Odin-Multi independent validation"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            sleep 2
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-phase4r-odin-seeded-v2
          path: predictions/odin_multi_seeded_v2_pose_screen/
          if-no-files-found: warn
          retention-days: 14
