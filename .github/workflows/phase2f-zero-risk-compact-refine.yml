name: Phase 2F Compact Zero-Risk Refinement

on:
  push:
    paths:
      - "scripts/nvidia_rfdiffusion_zero_risk_compact_refine.py"
      - ".github/workflows/phase2f-zero-risk-compact-refine.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate compact zero-risk refinement
        run: python scripts/nvidia_rfdiffusion_zero_risk_compact_refine.py
      - name: Inspect
        if: always()
        run: |
          if [[ -s structures/rfdiffusion/nvidia_zero_risk_compact_refine/selection_summary.json ]]; then
            cat structures/rfdiffusion/nvidia_zero_risk_compact_refine/selection_summary.json
          fi
      - name: Commit campaign
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d structures/rfdiffusion/nvidia_zero_risk_compact_refine ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add structures/rfdiffusion/nvidia_zero_risk_compact_refine
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add compact zero-risk TfR1 backbone refinement"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-zero-risk-compact-refine
          path: structures/rfdiffusion/nvidia_zero_risk_compact_refine/
          if-no-files-found: warn
          retention-days: 14
