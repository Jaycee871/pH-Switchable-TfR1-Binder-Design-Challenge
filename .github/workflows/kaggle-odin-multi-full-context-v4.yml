name: Kaggle TfR1 Odin-Multi Full Context V4

on:
  push:
    paths:
      - "kaggle/odin_multi_full_context_v4/TRIGGER"
  workflow_dispatch:

concurrency:
  group: tfr1-kaggle-odin-full-context-v4
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 390

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight runner syntax
        run: python -m py_compile kaggle/odin_multi_full_context_v4/tfr1_odin_multi_full_context_v4.py

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Push and monitor full-context v4
        id: kaggle
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v4_outputs
          KERNEL="packkwanlow/tfr1-odin-multi-full-context-v4"
          DIR="kaggle/odin_multi_full_context_v4"

          kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 --timeout 19800

          doneflag=0
          for i in $(seq 1 330); do
            status="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[poll $i] $status"
            if echo "$status" | grep -Eqi 'complete|completed'; then
              doneflag=1
              break
            fi
            if echo "$status" | grep -Eqi 'error|failed|cancelled'; then
              kaggle kernels logs "$KERNEL" > v4_outputs/kaggle-run.log || true
              break
            fi
            sleep 60
          done

          kaggle kernels output "$KERNEL" -p v4_outputs -o || true
          kaggle kernels logs "$KERNEL" > v4_outputs/kaggle-run.log || true
          find v4_outputs -type f -printf '%p %s bytes\n' | sort

          if [[ "$doneflag" != 1 ]]; then exit 1; fi

      - name: Record status
        if: always()
        run: |
          mkdir -p v4_outputs
          {
            echo "kaggle_outcome=${{ steps.kaggle.outcome }}"
            echo "sha=$GITHUB_SHA"
            date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          } > v4_outputs/workflow-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-odin-multi-full-context-v4
          path: v4_outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Sync compact v4 outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          DEST="odin_multi/kaggle_full_context_v4"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          if [[ -d v4_outputs/tfr1_odin_full_context_v4 ]]; then
            SRC="v4_outputs/tfr1_odin_full_context_v4"
            for f in smoke_summary.json selection.csv selected_sequences.fasta                      design_exit_code.txt select_exit_code.txt driver_probe.txt                      odin_commit.txt odin_warm_start_patch.txt; do
              [[ ! -f "$SRC/$f" ]] || cp "$SRC/$f" "$DEST/"
            done
          fi
          cp v4_outputs/kaggle-run.log "$DEST/" 2>/dev/null || true
          cp v4_outputs/workflow-status.txt "$DEST/" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record TfR1 Odin-Multi full-context v4"

          pushed=0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            sleep 2
          done
          test "$pushed" = 1

      - name: Fail if Kaggle campaign failed
        if: steps.kaggle.outcome != 'success'
        run: exit 1
