name: Phase IL2 Validate Sparse Inference Loop R2

on:
  workflow_run:
    workflows:
      - "Phase IL2 Design Sparse Inference Loop R2"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY1: ${{ secrets.NVIDIA_API_KEY1 }}
      NVIDIA_API_TOKEN: ${{ secrets.NVIDIA_API_TOKEN }}
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check R2 candidates
        id: gate
        shell: bash
        run: |
          if [[ -s designs/inference_loop/full_context_r2/pose_screen_candidates.csv ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Biopython
        if: steps.gate.outputs.passed == 'true'
        run: python -m pip install "biopython>=1.85"

      - name: Sequence-only full human-mouse validation
        if: steps.gate.outputs.passed == 'true'
        run: python scripts/nvidia_boltz2_validate_inference_loop_r2.py

      - name: Inspect
        if: steps.gate.outputs.passed == 'true'
        run: |
          cat predictions/inference_loop_full_context_r2/batch_summary.json
          cat predictions/inference_loop_full_context_r2/pose_pass_ids.json

      - name: Commit R2 validation
        if: steps.gate.outputs.passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/inference_loop_full_context_r2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add sparse inference-loop R2 full-context validation"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            sleep 2
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfr1-inference-loop-r2-validation
          path: predictions/inference_loop_full_context_r2/
          if-no-files-found: warn
          retention-days: 14
